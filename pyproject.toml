[project]
name = "pixel-flippers"
version = "0.1.0"
description = "MCP server that gives Claude hands, eyes, and a diary for Pokémon — Game Boy, GBA, and a real Switch"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
emulator = ["pyboy>=2.4"]
gba = ["stable-retro>=1.0", "pygame>=2.1"]
switch = ["opencv-python>=4.8"]  # capture card frames; NXBT installs on the Pi, not here
dev = ["pytest>=8"]

[project.scripts]
pixel-flippers = "pixel_flippers.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_flippers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
